title: Penguin Class
description: International Penguin Class Dinghy Association
url: https://penguinclass.org
baseurl: ""
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
seo:
  title_separator: " | "
collections:
  events:
    output: true
    permalink: /events/:year/:month/:day/:title/
  classifieds:
    output: true
    permalink: /classifieds/:year/:month/:day/:title/
  results:
    output: true
    permalink: /results/:name/
defaults:
  - scope: { path: "", type: posts }
    values: 
      layout: post
      permalink: /news/:year/:month/:day/:title/
      future: false
  - scope: { path: "", type: events }
    values: { layout: event }
  - scope: { path: "", type: classifieds }
    values: { layout: classified }
  - scope: { path: "", type: results }
    values: { layout: result }
markdown: kramdown
future: true
# Analytics (GA4 + Plausible). All toggles default off. See README "Analytics".
# Optional env overrides (e.g. GitHub Actions secrets) are applied in
# _plugins/analytics_env_override.rb when local plugins are allowed (not in Jekyll safe mode).
analytics:
  ga4:
    enabled: false
    measurement_id: ""
  plausible:
    enabled: false
    domain: ""
    script_src: "https://plausible.io/js/script.js"
