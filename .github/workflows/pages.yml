name: Build and Deploy
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Debug environment variables
        run: |
          echo "GA4 enabled: [$JEKYLL_ANALYTICS_GA4_ENABLED]"
          echo "GA4 id present? [${JEKYLL_ANALYTICS_GA4_MEASUREMENT_ID:+yes}]"
          echo "Plausible enabled: [$JEKYLL_ANALYTICS_PLAUSIBLE_ENABLED]"
          echo "Plausible domain: [$JEKYLL_ANALYTICS_PLAUSIBLE_DOMAIN]"
          echo "Plausible script: [$JEKYLL_ANALYTICS_PLAUSIBLE_SCRIPT_SRC]"
        env:
          JEKYLL_ANALYTICS_GA4_ENABLED: ${{ vars.JEKYLL_ANALYTICS_GA4_ENABLED }}
          JEKYLL_ANALYTICS_GA4_MEASUREMENT_ID: ${{ vars.JEKYLL_ANALYTICS_GA4_MEASUREMENT_ID }}
          JEKYLL_ANALYTICS_PLAUSIBLE_ENABLED: ${{ vars.JEKYLL_ANALYTICS_PLAUSIBLE_ENABLED }}
          JEKYLL_ANALYTICS_PLAUSIBLE_DOMAIN: ${{ vars.JEKYLL_ANALYTICS_PLAUSIBLE_DOMAIN }}
          JEKYLL_ANALYTICS_PLAUSIBLE_SCRIPT_SRC: ${{ vars.JEKYLL_ANALYTICS_PLAUSIBLE_SCRIPT_SRC }}
          
      - name: Build site
        run: |
          bundle install
          JEKYLL_ENV=production bundle exec jekyll build -d _site
        env:
          JEKYLL_ANALYTICS_GA4_ENABLED: ${{ vars.JEKYLL_ANALYTICS_GA4_ENABLED }}
          JEKYLL_ANALYTICS_GA4_MEASUREMENT_ID: ${{ vars.JEKYLL_ANALYTICS_GA4_MEASUREMENT_ID }}
          JEKYLL_ANALYTICS_PLAUSIBLE_ENABLED: ${{ vars.JEKYLL_ANALYTICS_PLAUSIBLE_ENABLED }}
          JEKYLL_ANALYTICS_PLAUSIBLE_DOMAIN: ${{ vars.JEKYLL_ANALYTICS_PLAUSIBLE_DOMAIN }}
          JEKYLL_ANALYTICS_PLAUSIBLE_SCRIPT_SRC: ${{ vars.JEKYLL_ANALYTICS_PLAUSIBLE_SCRIPT_SRC }}

      - name: Inspect built HTML
        run: |
          grep -R "G-1CD6SM3L0R" _site || true
          grep -R "plausible.io/js/script.js" _site || true
          grep -R "penguinclass.org" _site || true
          
      - name: Ensure archive manifest
        run: |
          python3 scripts/build_archive_manifest.py archive || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4