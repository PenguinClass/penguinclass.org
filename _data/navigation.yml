# Top-level menus. `url` is the section's overview page; `intro` and each
# child's `description` are shown on that overview page (see
# _includes/section-overview.html). The menu itself only uses title/url.
- title: Community
  url: /community/
  intro: News, events and classifieds from Penguin sailors around the world.
  children:
    - title: Classifieds
      url: /classifieds/
      description: Penguins, sails and parts for sale or wanted.
    - title: Events
      url: /events/
      description: Upcoming regattas and class events, plus past schedules.
    - title: Group
      url: https://www.facebook.com/groups/335010659935494/
      external: true
      description: Join the conversation in the Penguin Class Facebook group.
    - title: News
      url: /news/
      description: Class announcements, newsletters and regatta reports.
