    <p class=MsoNormal align=center style='text-align:center'><b
    style='mso-bidi-font-weight:normal'>Parental Permission and Release from
    Liability<o:p></o:p></b></p>
    <p class=MsoNormal align=center style='text-align:center'><b
    style='mso-bidi-font-weight:normal'><o:p>&nbsp;</o:p></b></p>
    <p class=MsoNormal>The undersigned hereby grants permission for their child
    to participate in the events included in the 2019 International Penguin
    Class Dinghy Association Championships, August 24-25.<span
    style='mso-spacerun:yes'>  </span>The undersigned hereby releases the
    International Penguin Class Dinghy Association, the <span class=SpellE>Tred</span>
    Avon Yacht Club and their respective Officers, and the Race Committee from
    any liability for personal injury or illness or property damage or loss
    resulting from or incidental to my child’s participation in any aspect of
    this event.<span style='mso-spacerun:yes'>  </span>My child’s participation
    is voluntary.<span style='mso-spacerun:yes'>  </span>My child’s equipment
    is in safe condition.<span style='mso-spacerun:yes'>  </span>To the best of
    my knowledge, my child is physically well enough to participate
    safely.<span style='mso-spacerun:yes'>  </span>I agree to be bound by the
    Racing Rules of Sailing, and by all other rules that govern this event.</p>
    <p class=MsoNormal><o:p>&nbsp;</o:p></p>
